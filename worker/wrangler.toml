name = "er-vision"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["* * * * *"]   # 1분마다: 정밀 분석 대기열, 내 경기 자동 수집, 메타 갱신

[[d1_databases]]
binding = "DB"
database_name = "er-vision"
database_id = "__D1_ID__"   # 배포할 때 워크플로가 실제 ID로 바꾼다
migrations_dir = "migrations"

[vars]
API_BASE = "https://open-api.bser.io"
SLEEP_MS = "1100"          # 게임 API 한도: 초당 1회
DETAIL_PER_RUN = "5"       # 실행 1회당 경기 상세 처리 수 (상세 1판 ≈ CPU 1ms, 무료 플랜 한도 10ms)
LIST_PAGES_PER_RUN = "4"   # 실행 1회당 경기 목록 페이지 수
