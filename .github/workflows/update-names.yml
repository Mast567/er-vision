# 캐릭터·지역·증강·전술 스킬 한글 이름표를 매주 새로 만들어 서버 DB(settings.names)에 넣는다.
# 약관상 게임 텍스트를 공개 저장소에 파일로 두지 않으므로 커밋하지 않는다.
name: Update names

on:
  schedule:
    - cron: '17 19 * * 2'   # 매주 수요일 04:17 (KST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  names:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: ./scripts/prepare-d1.sh
      - name: 이름표 만들기
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
        run: python3 ../tools/build_names.py names.sql
      - name: 서버 DB에 넣기
        run: npx wrangler d1 execute er-vision --remote --file names.sql
