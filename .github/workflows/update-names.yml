# 캐릭터·지역·증강·전술 스킬 한글 이름표(js/data/names.js)를 매주 새로 만든다. 바뀐 게 있을 때만 커밋한다.
name: Update names

on:
  schedule:
    - cron: '17 19 * * 2'   # 매주 수요일 04:17 (KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 이름표 만들기
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
        run: python3 tools/build_names.py
      - name: 바뀌었으면 커밋
        run: |
          if git diff --quiet -- js/data/names.js; then echo "변경 없음"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data/names.js
          git commit -m "이름표 갱신"
          git push
