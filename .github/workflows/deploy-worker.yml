# worker/ 가 바뀌어 main에 올라오면 Cloudflare에 자동 배포한다.
# 필요한 GitHub 비밀값: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ER_API_KEY, SITE_TOKEN, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET
# 있으면 쓰는 비밀값: GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET (없으면 구글 로그인 버튼이 숨는다)
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**', 'tools/build_names.py', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: 비밀값 확인
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ER_API_KEY SITE_TOKEN DISCORD_CLIENT_ID DISCORD_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then echo "::error::GitHub 비밀값 $v 가 없습니다 (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - name: D1 데이터베이스 준비 (없으면 만든다)
        run: ./scripts/prepare-d1.sh

      # 되돌릴 때: npx wrangler d1 time-travel restore er-vision --bookmark=<아래 로그의 bookmark>  (무료 플랜은 7일 안)
      - name: DB 복구 지점 기록
        continue-on-error: true   # 기록을 못 해도 Time Travel 자체는 켜져 있어 시각(--timestamp)으로 되돌릴 수 있다
        run: npx wrangler d1 time-travel info er-vision

      - name: DB 구조 적용
        run: npx wrangler d1 migrations apply er-vision --remote

      - name: 이름표 넣기 (실패해도 배포는 계속)
        continue-on-error: true
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
        run: python3 ../tools/build_names.py names.sql && npx wrangler d1 execute er-vision --remote --file names.sql

      - name: 배포
        # 처음 만드는 Worker는 Cloudflare 쪽 반영이 늦어 후속 설정이 실패할 때가 있어 한 번 더 시도한다
        run: npx wrangler deploy || (sleep 20 && npx wrangler deploy)

      - name: 비밀값 등록
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
          DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          printf '%s' "$ER_API_KEY" | npx wrangler secret put ER_API_KEY
          printf '%s' "$SITE_TOKEN" | npx wrangler secret put SITE_TOKEN
          printf '%s' "$DISCORD_CLIENT_ID" | npx wrangler secret put DISCORD_CLIENT_ID
          printf '%s' "$DISCORD_CLIENT_SECRET" | npx wrangler secret put DISCORD_CLIENT_SECRET
          if [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_CLIENT_SECRET" ]; then
            printf '%s' "$GOOGLE_CLIENT_ID" | npx wrangler secret put GOOGLE_CLIENT_ID
            printf '%s' "$GOOGLE_CLIENT_SECRET" | npx wrangler secret put GOOGLE_CLIENT_SECRET
          else
            echo "구글 로그인 비밀값이 없어 구글 로그인은 꺼진 채로 둡니다."
          fi

      - name: 다음 단계
        run: echo "배포 완료. 디스코드 앱의 Redirect 주소와 구글 OAuth 클라이언트의 승인된 리디렉션 URI는 둘 다 위 '배포' 단계 로그에 나온 https://...workers.dev 주소 뒤에 /auth/callback 을 붙인 것입니다."
