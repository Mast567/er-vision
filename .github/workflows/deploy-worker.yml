# worker/ 가 바뀌어 main에 올라오면 Cloudflare에 자동 배포한다.
# 필요한 GitHub 비밀값: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ER_API_KEY, SITE_TOKEN
name: Deploy worker

on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/deploy-worker.yml']
  workflow_dispatch:

concurrency:
  group: deploy-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - run: npm ci

      - name: 비밀값 확인
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ER_API_KEY SITE_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::GitHub 비밀값 $v 가 없습니다 (Settings → Secrets and variables → Actions)"; exit 1; fi
          done

      - name: D1 데이터베이스 준비 (없으면 만든다)
        run: |
          find_id() { npx wrangler d1 list --json | jq -r '.[] | select(.name=="er-vision") | (.uuid // .id // .database_id)' | head -1; }
          ID=$(find_id)
          if [ -z "$ID" ]; then
            npx wrangler d1 create er-vision < /dev/null
            ID=$(find_id)
          fi
          if [ -z "$ID" ]; then echo "::error::D1 데이터베이스 ID를 찾지 못했습니다. 토큰에 Account / D1 / Edit 권한이 있는지 확인하세요."; exit 1; fi
          sed -i "s/__D1_ID__/$ID/" wrangler.toml

      - name: DB 구조 적용
        run: npx wrangler d1 migrations apply er-vision --remote

      - name: 배포
        # 처음 만드는 Worker는 Cloudflare 쪽 반영이 늦어 후속 설정이 실패할 때가 있어 한 번 더 시도한다
        run: npx wrangler deploy || (sleep 20 && npx wrangler deploy)

      - name: 비밀값 등록
        env:
          ER_API_KEY: ${{ secrets.ER_API_KEY }}
          SITE_TOKEN: ${{ secrets.SITE_TOKEN }}
        run: |
          printf '%s' "$ER_API_KEY" | npx wrangler secret put ER_API_KEY
          printf '%s' "$SITE_TOKEN" | npx wrangler secret put SITE_TOKEN

      - name: 다음 단계
        run: echo "배포 완료. 사이트 설정에 넣을 주소는 위 '배포' 단계 로그에 나온 https://...workers.dev 주소입니다."
