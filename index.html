<!doctype html>
<html lang="ko" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ER Vision</title>
<meta name="description" content="이터널 리턴 랭크 복기 노트. 경기 기록 분석, 리플레이 복기, 코칭 리포트.">
<link rel="stylesheet" href="css/style.css">
<script src="js/vendor/chart.umd.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">ER</span><span class="brand-name">Vision</span><span class="brand-sub">랭크 복기 노트</span></div>
  <nav class="nav" id="nav"></nav>
  <div class="topbar-right">
    <label class="season-pick" id="season-pick-wrap"><span class="muted">모드</span><select id="mode-pick"></select><span class="muted" style="margin-left:8px">시즌</span><select id="season-pick"></select></label>
    <span id="owner-chip" class="chip"></span>
  </div>
</header>

<main id="view" class="view"></main>

<div id="toast" class="toast" hidden></div>

<template id="tpl-gate">
  <section class="gate">
    <h1>ER Vision</h1>
    <p class="muted">이터널 리턴 복기 노트. 내 경기 기록을 모아 분석하고, 판마다 복기노트를 남깁니다. 복기노트는 나만 볼 수 있습니다.</p>
    <label id="gate-url-wrap">서버 주소<input id="gate-url" type="url" placeholder="https://er-vision.….workers.dev"></label>
    <div class="row"><button class="btn primary" id="gate-go">디스코드로 로그인</button><span id="gate-msg" class="muted"></span></div>
    <details class="help"><summary>무엇을 가져가나요?</summary>
      <p>디스코드 고유번호와 표시 이름만 받습니다. 이메일, 친구 목록, 서버 목록은 받지 않습니다. 계정은 설정에서 언제든 삭제할 수 있습니다.</p>
    </details>
  </section>
</template>

<script src="js/config.js"></script>
<script src="js/api.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
<!-- 기능 파일: 한 줄 = 기능 하나. 빼고 싶으면 그 줄만 지운다 -->
<script src="js/features/companions.js"></script>
</body>
</html>
